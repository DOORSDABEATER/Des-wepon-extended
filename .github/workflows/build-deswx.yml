
name: Build DeS Weapon Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract new project ZIP
        run: |
          unzip -q DeS-Weapon-Expansion-Project-FIXED.zip -d source

      - name: Build plugin
        working-directory: source/DESWX/plugin
        run: gradle --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-Weapon-Expansion
          path: source/DESWX/plugin/build/libs/*.jar
          if-no-files-found: error
