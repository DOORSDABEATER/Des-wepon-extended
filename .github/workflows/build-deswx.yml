
name: Build DeS Weapon Expansion

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: |
          unzip -q DeS-Weapon-Expansion-Project-with-workflow.zip -d source

      - name: Locate Gradle project
        run: |
          PROJECT_FILE=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find source -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "No Gradle project found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build plugin
        run: gradle -p "$PROJECT_DIR" --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-Weapon-Expansion
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
